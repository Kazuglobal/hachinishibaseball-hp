<div class="min-h-screen bg-gradient-to-b from-[#0a0a1a] via-[#0f1a2a] to-[#0a0a1a] pt-24 pb-16">
  <div class="container mx-auto px-4">
    <div class="text-center mb-16 relative">
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none overflow-hidden">
        <div class="w-96 h-96 bg-blue-500/10 rounded-full blur-3xl animate-pulse"></div>
      </div>
      <h1 class="text-5xl md:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-red-500 to-blue-500 mb-4 font-oswald tracking-wider relative z-10 drop-shadow-2xl">
        GAME CENTER
      </h1>
      <p class="text-white/60 text-lg font-medium relative z-10">⚾ 野球ミニゲームで遊ぼう！ ⚾</p>
    </div>
    
    <div class="grid md:grid-cols-3 gap-8 max-w-6xl mx-auto mb-20">
      @for (game of games; track game.id) {
        <a 
          [routerLink]="game.route"
          class="group relative bg-gradient-to-b from-[#1a1a2e] to-[#0f0f1e] rounded-3xl shadow-2xl overflow-hidden transform hover:scale-105 hover:-translate-y-2 transition-all duration-500 text-left block cursor-pointer border border-white/10 hover:border-white/30">
          <div class="h-40 bg-gradient-to-br {{game.color}} flex items-center justify-center relative overflow-hidden">
            <div class="absolute inset-0 bg-black/20"></div>
            <span class="text-7xl transform group-hover:scale-125 group-hover:rotate-12 transition-all duration-500 drop-shadow-2xl relative z-10">{{ game.icon }}</span>
          </div>
          <div class="p-6 relative z-10">
            <p class="text-xs text-white/40 font-oswald tracking-widest mb-1">{{ game.subtitle }}</p>
            <h3 class="text-2xl font-bold text-white mb-3 font-serif-jp">{{ game.title }}</h3>
            <p class="text-white/50 text-sm leading-relaxed mb-4">{{ game.description }}</p>
            <div class="pt-4 border-t border-white/10 flex items-center justify-between">
              <span class="text-sm text-white/40 font-medium uppercase tracking-wider">Best Score</span>
              <span class="font-bold font-oswald text-2xl text-white">{{ gameScoreService.getBestScore(game.type) | number }}</span>
            </div>
          </div>
        </a>
      }
    </div>
    
    <div class="max-w-xl mx-auto">
      <div class="bg-gradient-to-b from-[#1a1a2e] to-[#0f0f1e] rounded-3xl p-8 border border-white/10 shadow-2xl">
        <h3 class="text-white font-bold text-center mb-8 font-oswald text-2xl tracking-wider flex items-center justify-center gap-3">
          <span class="text-3xl">🏆</span>
          <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-orange-500">RANKING</span>
          <span class="text-3xl">🏆</span>
        </h3>
        <div class="flex justify-center gap-2 mb-8 flex-wrap">
          @for (game of games; track game.id) {
            <button 
              (click)="selectRankingGame(game.type)"
              class="px-4 py-2 rounded-xl text-sm font-bold transition-all duration-300 border-2"
              [class.bg-white/20]="selectedRankingGame() === game.type"
              [class.text-white]="selectedRankingGame() === game.type"
              [class.border-white/30]="selectedRankingGame() === game.type"
              [class.bg-transparent]="selectedRankingGame() !== game.type"
              [class.text-white/50]="selectedRankingGame() !== game.type"
              [class.border-white/10]="selectedRankingGame() !== game.type">
              <span class="mr-1">{{ game.icon }}</span>{{ game.title }}
            </button>
          }
        </div>
        <div class="bg-black/30 rounded-2xl overflow-hidden border border-white/5">
          <app-ranking-board [gameType]="selectedRankingGame()"></app-ranking-board>
        </div>
      </div>
    </div>
    
    <div class="text-center mt-16">
      <a routerLink="/" class="inline-flex items-center gap-3 text-white/50 hover:text-white transition-all font-medium py-3 px-6 hover:bg-white/5 rounded-xl">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        トップページへ戻る
      </a>
    </div>
  </div>
</div>
